[package]
name = "tsute-server-local"
description = "ローカル開発・テスト用サーバー（S3/DynamoDB/API Gateway の代替）"
edition.workspace = true
version.workspace = true

[[bin]]
name = "tsute-devserver"
path = "src/main.rs"

[dependencies]
tsute-proto = { path = "../proto" }
tsute-server-core = { path = "../server-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
url = "2"
