[package]
name = "tsute-server-lambda"
description = "つて バックエンドの AWS Lambda エントリポイント（DynamoDB / S3 / API Gateway）"
edition.workspace = true
version.workspace = true

[[bin]]
name = "tsute-lambda"
path = "src/main.rs"

[dependencies]
tsute-proto = { path = "../proto" }
tsute-server-core = { path = "../server-core" }
lambda_runtime = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-apigatewaymanagement = "1"
aws-smithy-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
