[package]
name = "tsute-webpush"
description = "Web Push（RFC 8030 / VAPID RFC 8292）送信。Payload は常に空（ADR-0015）"
edition.workspace = true
version.workspace = true

[[bin]]
name = "tsute-vapid-keygen"
path = "src/bin/keygen.rs"

[dependencies]
tsute-server-core = { path = "../server-core" }
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
url = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
