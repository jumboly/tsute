[package]
name = "tsute-server-core"
description = "つて バックエンドのドメインロジック（ストレージ・通知は trait で差し替え）"
edition.workspace = true
version.workspace = true

[dependencies]
tsute-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ed25519-dalek = "2"
