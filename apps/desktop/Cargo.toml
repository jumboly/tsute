[package]
name = "tsute-desktop"
edition.workspace = true
version.workspace = true

[[bin]]
name = "tsute"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
