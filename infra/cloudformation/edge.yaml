AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tsute edge (per environment, deploy in us-east-1): single FQDN CloudFront distribution.
  "/" = technical blog (S3, deployed by the separate blog repository), "/api/*" = HTTP API, "/ws" = WebSocket API.
  Owned by the application repository; the blog repository only syncs objects into BlogBucket and invalidates.

Parameters:
  EnvName:
    Type: String
    AllowedPattern: "[a-z0-9-]{1,16}"
  HttpApiDomain:
    Type: String
  WsApiDomain:
    Type: String
  AppDomainName:
    Type: String
    Default: ""
    Description: Custom FQDN (e.g. the APP_BASE_URL host). Empty = use the *.cloudfront.net domain.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering AppDomainName (required when AppDomainName is set)

  GitHubBlogRepo:
    Type: String
    Default: ""
    Description: >-
      Blog repository as it appears in the GitHub OIDC sub claim. With immutable subjects enabled this is
      owner@ownerId/repo@repoId (see gh api repos/OWNER/REPO/actions/oidc/customization/sub), otherwise owner/repo.
      Empty = no blog deploy role.

Conditions:
  HasDomain: !Not [!Equals [!Ref AppDomainName, ""]]
  HasBlogRepo: !Not [!Equals [!Ref GitHubBlogRepo, ""]]

Resources:
  BlogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub tsute-${EnvName}-blog-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  BlogOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub tsute-${EnvName}-blog
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BlogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BlogBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${BlogBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # 存在しないキーに S3 が 403 ではなく 404 を返すようにする（404 だけを 404 ページに差し替え、
          # 権限ミスによる本物の 403 は隠さないため）。閲覧者からは一覧を取れない: "/" は index.html に
          # 書き換わり、クエリ文字列はオリジンに転送されない
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:ListBucket
            Resource: !GetAtt BlogBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ブログの存在しない URL を、ブログ自身の /404.html の内容でステータス 404 にする。
  # CustomErrorResponses はディストリビューション全体に効き API の JSON エラーまで置き換えてしまい、
  # CloudFront Functions はオリジンが 4xx を返すと実行されないため、デフォルトビヘイビアだけに付けた
  # Lambda@Edge（origin-response）で行う。
  BlogNotFoundRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tsute-${EnvName}-blog-notfound
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: [lambda.amazonaws.com, edgelambda.amazonaws.com] }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: blog-notfound
          PolicyDocument:
            Statement:
              # Lambda@Edge は実行リージョンごとに /aws/lambda/us-east-1.<name> へログを書く
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/us-east-1.tsute-${EnvName}-blog-notfound:*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BlogBucket.Arn}/404.html"

  BlogNotFoundFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub tsute-${EnvName}-blog-notfound
      Description: Serve /404.html with status 404 for missing blog objects
      # Lambda@Edge は Node.js / Python・x86_64 のみ、環境変数不可（バケット名はコードに埋め込む）
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt BlogNotFoundRole.Arn
      Code:
        ZipFile: !Sub |
          'use strict';
          const { S3Client, GetObjectCommand } = require('@aws-sdk/client-s3');
          const s3 = new S3Client({ region: '${AWS::Region}' });
          // ブログのデプロイで 404.html が変わっても、数分で反映されれば十分
          const PAGE_TTL_MS = 5 * 60 * 1000;
          const FALLBACK = '<!doctype html><html lang="ja"><meta charset="utf-8"><title>404 Not Found</title><h1>404 Not Found</h1></html>';
          let page = null;
          let loadedAt = 0;

          async function notFoundPage() {
            if (page !== null && Date.now() - loadedAt < PAGE_TTL_MS) return page;
            try {
              const r = await s3.send(new GetObjectCommand({ Bucket: '${BlogBucket}', Key: '404.html' }));
              page = await r.Body.transformToString('utf-8');
              loadedAt = Date.now();
            } catch (e) {
              // 404 ページが読めなくても 404 自体は返す（古いキャッシュがあればそれを使う）
              console.log('failed to load 404.html: ' + e.name);
            }
            return page !== null ? page : FALLBACK;
          }

          exports.handler = async (event) => {
            const response = event.Records[0].cf.response;
            if (response.status !== '404') return response;
            response.statusDescription = 'Not Found';
            response.headers['content-type'] = [{ key: 'Content-Type', value: 'text/html; charset=utf-8' }];
            // 新しい記事を公開した直後に、その URL の 404 が長く残らないよう短めにする
            response.headers['cache-control'] = [{ key: 'Cache-Control', value: 'max-age=300' }];
            response.body = await notFoundPage();
            return response;
          };

  # Lambda@Edge はバージョン番号付き ARN でしか関連付けられない。
  # AWS::Lambda::Version はコード変更を検知しないため、関数のコードを変えたら Description を更新して新しい版を発行する
  BlogNotFoundVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref BlogNotFoundFunction
      Description: "v1: serve /404.html with status 404"

  # 静的サイトジェネレータの "/posts/foo/" → "/posts/foo/index.html" を解決する
  BlogIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub tsute-${EnvName}-blog-index
      AutoPublish: true
      FunctionConfig:
        Comment: Append index.html to directory-style blog URLs
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          if (uri.endsWith('/')) {
            req.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            req.uri = uri + '/index.html';
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    # cfn-lint は CertificateArn の既定値 "" で ARN 形式を検査するが、その値は HasDomain が真のとき
    # （= ARN が与えられたとき）にしか使われないため W1030 は誤検知
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      DistributionConfig:
        Comment: !Sub tsute ${EnvName}
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Aliases: !If [HasDomain, [!Ref AppDomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        Origins:
          - Id: blog
            DomainName: !GetAtt BlogBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt BlogOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: http-api
            DomainName: !Ref HttpApiDomain
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
          - Id: ws-api
            DomainName: !Ref WsApiDomain
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: blog
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt BlogIndexFunction.FunctionARN
          # デフォルトビヘイビア（ブログ）だけに付ける。/api/* と /ws のレスポンスには関与しない
          LambdaFunctionAssociations:
            - EventType: origin-response
              LambdaFunctionARN: !Ref BlogNotFoundVersion
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: http-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            # Host を転送すると API Gateway がドメイン不一致で拒否するため除外する
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          - PathPattern: /ws
            TargetOriginId: ws-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # Blog リポジトリの CI 用。Blog バケットへの同期と invalidation だけを許可し、アプリ側には一切触れられない
  BlogDeployRole:
    Type: AWS::IAM::Role
    Condition: HasBlogRepo
    Properties:
      RoleName: !Sub tsute-${EnvName}-github-blog-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # Environment（production）で保護されたジョブだけに限定する。ブランチ保護や承認を Environment 側で
              # 掛けられ、リポジトリ内の他ワークフロー・PR からはロールを引き受けられない
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubBlogRepo}:environment:production
      Policies:
        - PolicyName: tsute-blog-deploy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub "${BlogBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BlogBucket.Arn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  BlogDeployRoleArn:
    Condition: HasBlogRepo
    Value: !GetAtt BlogDeployRole.Arn
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  BlogBucketName:
    Value: !Ref BlogBucket
  AppBaseUrl:
    Value: !If [HasDomain, !Sub "https://${AppDomainName}", !Sub "https://${Distribution.DomainName}"]
