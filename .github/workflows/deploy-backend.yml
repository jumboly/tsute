name: Deploy backend

# Blog は別リポジトリ・別ワークフロー。ここではアプリの Backend / Edge だけを扱う。
on:
  push:
    branches: [main]
    paths:
      - "crates/proto/**"
      - "crates/server-core/**"
      - "crates/server-lambda/**"
      - "crates/webpush/**"
      - "build-support/**"
      - "infra/**"
      - "Cargo.lock"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS STS（長期アクセスキーを使わない）

concurrency:
  group: deploy-${{ inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment ごとに設定値と承認ルールを持たせる。public リポジトリの Actions ログに独自ドメインや
    # アカウント ID を載せないよう、AWS_REGION 以外は Secrets（ログでマスクされる）にする（ADR-0010）
    environment: ${{ inputs.environment || 'test' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TSUTE_APP_DOMAIN: ${{ secrets.TSUTE_APP_DOMAIN }}
      TSUTE_CERT_ARN: ${{ secrets.TSUTE_CERT_ARN }}
      TSUTE_GITHUB_BLOG_REPO: ${{ secrets.TSUTE_GITHUB_BLOG_REPO }}
      TSUTE_GITHUB_APP_REPO: ${{ secrets.TSUTE_GITHUB_APP_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install cargo-lambda
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: infra/deploy.sh "${{ inputs.environment || 'test' }}"
      - name: Smoke test
        run: |
          URL="$(jq -r .app_base_url infra/.build/${{ inputs.environment || 'test' }}.json)"
          curl -fsS "$URL/api/health"
